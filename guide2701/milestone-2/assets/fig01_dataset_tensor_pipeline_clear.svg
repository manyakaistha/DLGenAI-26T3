<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" role="img" aria-label="One strip becomes aligned tensors">
<rect width="1200" height="470" fill="#fffaf0"/>
<text x="48" y="62" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#202522">One strip becomes aligned tensors</text>
<text x="48" y="94" font-family="Arial,sans-serif" font-size="17" fill="#52635d">The image and each class mask share the same H × W pixel grid.</text>
<rect x="42" y="155" width="246" height="175" rx="16" fill="#ffffff" stroke="#d6d8cb" stroke-width="2"/>
<rect x="58" y="172" width="34" height="34" rx="9" fill="#087e83" stroke="#087e83" stroke-width="2"/>
<text x="75" y="196" fill="white" font-size="19" font-weight="700" text-anchor="middle" font-family="Arial,sans-serif">1</text>
<text x="104" y="197" fill="#202522" font-size="21" font-weight="700" text-anchor="start" font-family="Arial,sans-serif">Raw strip</text>
<text x="62" y="237" fill="#52635d" font-size="17" font-weight="400" text-anchor="start" font-family="Arial,sans-serif">grayscale image</text>
<text x="62" y="265" fill="#52635d" font-size="17" font-weight="400" text-anchor="start" font-family="Arial,sans-serif">H × W intensities</text>
<path d="M288 242 L339 242" fill="none" stroke="#087e83" stroke-width="3"/>
<path d="M330.2 248.6 L339 242 L330.2 235.4" fill="none" stroke="#087e83" stroke-width="3"/>
<rect x="352" y="155" width="246" height="175" rx="16" fill="#ffffff" stroke="#d6d8cb" stroke-width="2"/>
<rect x="368" y="172" width="34" height="34" rx="9" fill="#255a9b" stroke="#255a9b" stroke-width="2"/>
<text x="385" y="196" fill="white" font-size="19" font-weight="700" text-anchor="middle" font-family="Arial,sans-serif">2</text>
<text x="414" y="197" fill="#202522" font-size="21" font-weight="700" text-anchor="start" font-family="Arial,sans-serif">Image tensor</text>
<text x="372" y="237" fill="#52635d" font-size="17" font-weight="400" text-anchor="start" font-family="Arial,sans-serif">normalize intensity</text>
<text x="372" y="265" fill="#52635d" font-size="17" font-weight="400" text-anchor="start" font-family="Arial,sans-serif">[1,H,W] float32</text>
<path d="M598 242 L649 242" fill="none" stroke="#087e83" stroke-width="3"/>
<path d="M640.2 248.6 L649 242 L640.2 235.4" fill="none" stroke="#087e83" stroke-width="3"/>
<rect x="662" y="155" width="246" height="175" rx="16" fill="#ffffff" stroke="#d6d8cb" stroke-width="2"/>
<rect x="678" y="172" width="34" height="34" rx="9" fill="#d88836" stroke="#d88836" stroke-width="2"/>
<text x="695" y="196" fill="white" font-size="19" font-weight="700" text-anchor="middle" font-family="Arial,sans-serif">3</text>
<text x="724" y="197" fill="#202522" font-size="21" font-weight="700" text-anchor="start" font-family="Arial,sans-serif">Mask stack</text>
<text x="682" y="237" fill="#52635d" font-size="17" font-weight="400" text-anchor="start" font-family="Arial,sans-serif">decode each class RLE</text>
<text x="682" y="265" fill="#52635d" font-size="17" font-weight="400" text-anchor="start" font-family="Arial,sans-serif">[4,H,W] binary</text>
<path d="M908 242 L959 242" fill="none" stroke="#087e83" stroke-width="3"/>
<path d="M950.2 248.6 L959 242 L950.2 235.4" fill="none" stroke="#087e83" stroke-width="3"/>
<rect x="972" y="155" width="186" height="175" rx="16" fill="#ffffff" stroke="#d6d8cb" stroke-width="2"/>
<rect x="988" y="172" width="34" height="34" rx="9" fill="#d95a40" stroke="#d95a40" stroke-width="2"/>
<text x="1005" y="196" fill="white" font-size="19" font-weight="700" text-anchor="middle" font-family="Arial,sans-serif">4</text>
<text x="1034" y="197" fill="#202522" font-size="21" font-weight="700" text-anchor="start" font-family="Arial,sans-serif">Pair</text>
<text x="992" y="237" fill="#52635d" font-size="17" font-weight="400" text-anchor="start" font-family="Arial,sans-serif">same pixel</text>
<text x="992" y="265" fill="#52635d" font-size="17" font-weight="400" text-anchor="start" font-family="Arial,sans-serif">coordinates</text>
<rect x="43" y="377" width="1114" height="55" rx="8" fill="#eaf2ef" stroke="#c8dbd3" stroke-width="2"/>
<text x="62" y="411" fill="#087e83" font-size="17" font-weight="700" text-anchor="start" font-family="Arial,sans-serif">Split by image ID before sampling; a mask must undergo the same spatial transform as its image.</text>
</svg>
