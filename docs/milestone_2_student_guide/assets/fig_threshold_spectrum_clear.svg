<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 385" role="img" aria-label="Threshold controls which pixels become positive">
<rect width="1200" height="385" fill="#fffaf0"/>
<text x="48" y="62" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#202522">Threshold controls which pixels become positive</text>
<text x="48" y="94" font-family="Arial,sans-serif" font-size="17" fill="#52635d">Moving τ changes decisions without retraining the model.</text>
<rect x="58" y="143" width="1080" height="14" rx="7" fill="#d7e1dc" stroke="#d7e1dc" stroke-width="2"/>
<rect x="80" y="133" width="8" height="34" rx="4" fill="#087e83" stroke="#087e83" stroke-width="2"/>
<text x="84" y="194" fill="#202522" font-size="17" font-weight="700" text-anchor="middle" font-family="Arial,sans-serif">.2</text>
<rect x="595" y="133" width="8" height="34" rx="4" fill="#087e83" stroke="#087e83" stroke-width="2"/>
<text x="599" y="194" fill="#202522" font-size="17" font-weight="700" text-anchor="middle" font-family="Arial,sans-serif">.5</text>
<rect x="1109" y="133" width="8" height="34" rx="4" fill="#087e83" stroke="#087e83" stroke-width="2"/>
<text x="1113" y="194" fill="#202522" font-size="17" font-weight="700" text-anchor="middle" font-family="Arial,sans-serif">.8</text>
<rect x="66" y="225" width="494" height="114" rx="16" fill="#ffffff" stroke="#d6d8cb" stroke-width="2"/>
<rect x="82" y="242" width="34" height="34" rx="9" fill="#087e83" stroke="#087e83" stroke-width="2"/>
<text x="99" y="266" fill="white" font-size="19" font-weight="700" text-anchor="middle" font-family="Arial,sans-serif">↓</text>
<text x="128" y="267" fill="#202522" font-size="21" font-weight="700" text-anchor="start" font-family="Arial,sans-serif">Lower threshold</text>
<text x="86" y="307" fill="#52635d" font-size="17" font-weight="400" text-anchor="start" font-family="Arial,sans-serif">Finds more faint pixels; may raise false alarms.</text>
<rect x="640" y="225" width="494" height="114" rx="16" fill="#ffffff" stroke="#d6d8cb" stroke-width="2"/>
<rect x="656" y="242" width="34" height="34" rx="9" fill="#d88836" stroke="#d88836" stroke-width="2"/>
<text x="673" y="266" fill="white" font-size="19" font-weight="700" text-anchor="middle" font-family="Arial,sans-serif">↑</text>
<text x="702" y="267" fill="#202522" font-size="21" font-weight="700" text-anchor="start" font-family="Arial,sans-serif">Higher threshold</text>
<text x="660" y="307" fill="#52635d" font-size="17" font-weight="400" text-anchor="start" font-family="Arial,sans-serif">Removes weak noise; may miss subtle defects.</text>
</svg>
