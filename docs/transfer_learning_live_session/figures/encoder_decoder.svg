<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 360" role="img" aria-labelledby="title desc"><title id="title">Encoder features and decoder skips</title><desc id="desc">For a 256 square input, ResNet18 extracts five features, from 64 channels at 128 square to 512 channels at 8 square. The decoder upsamples and concatenates earlier spatial features, ending at one 256 square logit map. Shapes omit batch size.</desc><defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="#24388c"/></marker></defs><rect width="820" height="360" fill="#f3eee4"/><g font-family="sans-serif" fill="#211f1b"><text x="32" y="35" font-size="21" font-weight="bold">Keep the spatial features. Replace the classifier.</text><text x="32" y="62" font-size="13">Input: 3 × 256 × 256. Shapes below are C × H × W; batch dimension omitted.</text><rect x="32" y="87" width="133" height="74" fill="#e8e1d4" stroke="#625e53"/><text x="98" y="113" text-anchor="middle" font-weight="bold">s1</text><text x="98" y="140" text-anchor="middle" font-size="12">64 × 128 × 128</text><path d="M165 124 h19" stroke="#24388c" marker-end="url(#arrow)"/><rect x="184" y="87" width="133" height="74" fill="#e8e1d4" stroke="#625e53"/><text x="250" y="113" text-anchor="middle" font-weight="bold">s2</text><text x="250" y="140" text-anchor="middle" font-size="12">64 × 64 × 64</text><path d="M317 124 h19" stroke="#24388c" marker-end="url(#arrow)"/><rect x="336" y="87" width="133" height="74" fill="#e8e1d4" stroke="#625e53"/><text x="402" y="113" text-anchor="middle" font-weight="bold">s3</text><text x="402" y="140" text-anchor="middle" font-size="12">128 × 32 × 32</text><path d="M469 124 h19" stroke="#24388c" marker-end="url(#arrow)"/><rect x="488" y="87" width="133" height="74" fill="#e8e1d4" stroke="#625e53"/><text x="554" y="113" text-anchor="middle" font-weight="bold">s4</text><text x="554" y="140" text-anchor="middle" font-size="12">256 × 16 × 16</text><path d="M621 124 h19" stroke="#24388c" marker-end="url(#arrow)"/><rect x="640" y="87" width="133" height="74" fill="#e8e1d4" stroke="#625e53"/><text x="706" y="113" text-anchor="middle" font-weight="bold">s5</text><text x="706" y="140" text-anchor="middle" font-size="12">512 × 8 × 8</text><path d="M706 161 V235 H105 V170" fill="none" stroke="#24388c" stroke-width="3" marker-end="url(#arrow)"/><path d="M554 162 V230 M402 162 V230 M250 162 V230" fill="none" stroke="#e7462b" stroke-width="2" stroke-dasharray="5 4"/><text x="410" y="217" text-anchor="middle" font-size="14">upsample → concatenate skip → convolution</text><rect x="32" y="266" width="756" height="60" fill="#faf6ee" stroke="#625e53"/><text x="410" y="291" text-anchor="middle" font-size="15">New decoder + 1 × 1 head → one logit channel at 256 × 256</text><text x="410" y="312" text-anchor="middle" font-size="12">Example first join: 512 + 256 = 768 channels. Sigmoid belongs to loss/evaluation.</text></g></svg>